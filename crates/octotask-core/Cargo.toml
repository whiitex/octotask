[package]
name = "octotask-core"
description = "Projects, repository caches and workspaces behind the octok command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "adapters"
path = "tests/adapters/mod.rs"

[[test]]
name = "config"
path = "tests/config/mod.rs"

[[test]]
name = "workspaces"
path = "tests/workspaces/mod.rs"
