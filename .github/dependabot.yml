version: 2

# Pull requests go to staging, like every other change: main only receives releases.
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
